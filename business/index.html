<!doctype html>
<html lang="hi">
<head>
<!--
  ShopSathi — Business App (dukaandar + staff)
  v1.0.5 (2026-10-11): customer ka janamdin mahina dukaandar customer page se set kare; naya QR scanner.
  v1.0.4 (2026-10-11): setup Step 5 mein gift ki photo (optional); points ka % QR/home par nahi dikhta.
  v1.0.3 (2026-10-11): Business app ka alag icon (gunmetal + gold briefcase badge).
  v1.0.2 (2026-10-11): install fix — manifest ko alag id (Chrome "already installed / could not open app" khatam).
  v1.0.1 (2026-10-11): Firebase config (shopsathi-25794) + admin number.
  v1.0.0 (2026-10-10): pehla release — setup wizard (5 step), pending bills approve/reject
  (final amount edit, duplicate check), customers (search, QR scan, detail, call/WhatsApp, block,
  bina smartphone wale customer, manual bill), gifts + gift requests, reports + settlement list,
  Excel backup, photo archive (ZIP), nayi scheme, staff login, plan/upgrade, 4 bhasha, dukaan delete.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShopSathi Business</title>
<meta name="theme-color" content="#C2C7CC">
<meta name="description" content="ShopSathi Business — customer reward points manage karein">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icons/biz-192.png">
<link rel="apple-touch-icon" href="../icons/biz-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>
@media print{body *{visibility:hidden}#printable,#printable *{visibility:visible}#printable{position:absolute;left:0;top:0;width:100%}.noprint{display:none!important}}
.rolebadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--gold-l);margin-left:6px;vertical-align:middle}
.menu .item{min-height:56px}
.reasons .chip{text-align:left}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<script src="../shared/config.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/common.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';
const t = SS.t, esc = SS.esc, ic = SS.ic;
const app = document.getElementById('app');
const B = {
  user: null, mobile: '', profile: null, shopId: null, shop: null, role: null,
  members: [], memMap: {}, pending: [], gifts: [], reds: [], tab: 'home', view: null,
  unsub: [], seenPending: null, pendingSignup: null, monthStats: null, custQuery: '', custSort: 'name'
};
const TYPES = ['kirana', 'medical', 'cloth', 'general', 'dairy', 'hardware', 'electronics', 'restaurant', 'salon', 'other'];
const REASONS = ['rs_photo', 'rs_amount', 'rs_old', 'rs_dup', 'rs_notours'];

/* ---------------- Boot / auth ---------------- */
function boot() {
  document.documentElement.lang = SS.htmlLang();
  if (!SS.configured()) { app.innerHTML = SS.notConfiguredHTML(); return; }
  if (!window.firebase) { app.innerHTML = SS.offlineLibHTML(); return; }
  SS.initFirebase();
  SS.registerSW();
  app.innerHTML = '<div class="authwrap"><div class="authhdr">' + SS.logo(88) + SS.wordmark(32) + '</div></div>';
  SS.auth.onAuthStateChanged((u) => { if (u) onLogin(u); else { cleanup(); B.user = null; renderAuth(); } });
}
function cleanup() { B.unsub.forEach((f) => { try { f(); } catch (e) {} }); B.unsub = []; }
const shopRef = () => SS.db.collection('shops').doc(B.shopId);
const isOwner = () => B.role === 'owner';

function renderAuth(mode) {
  mode = mode || 'login';
  app.innerHTML =
    '<div class="authwrap"><div class="authhdr">' + SS.logo(88) + SS.wordmark(34) +
    '<div style="font-weight:700;color:#33373C">' + t('biz_tagline') + '</div></div>' +
    '<main class="page" style="padding-bottom:30px">' +
    '<div class="row"><span class="muted">' + ic('lang') + '</span>' + SS.langSelect('lang') + '</div>' +
    '<div class="seg"><button class="' + (mode === 'login' ? 'on' : '') + '" data-m="login">' + t('login') + '</button><button class="' + (mode === 'signup' ? 'on' : '') + '" data-m="signup">' + t('new_shop_account') + '</button></div>' +
    '<form id="af" class="col">' +
    (mode === 'signup' ? '<label class="f">' + t('owner_name') + '<input class="inp" id="nm" autocomplete="name" required></label>' : '') +
    '<label class="f">' + t('mobile') + '<input class="inp" id="mb" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="98XXXXXXXX" required></label>' +
    '<label class="f">' + t('pin') + ' <small>' + t('pin_hint') + '</small><input class="inp" id="pn" type="password" inputmode="numeric" maxlength="6" autocomplete="' + (mode === 'signup' ? 'new-password' : 'current-password') + '" required></label>' +
    '<div id="aerr"></div><button class="btn dark big" type="submit">' + (mode === 'signup' ? t('create_account') : t('login')) + '</button></form>' +
    '<p class="small muted center" style="margin:0">' + t('staff_login_hint') + '</p>' +
    '<p class="small muted center" style="margin:0">' + t('forgot_pin_biz') + '</p>' +
    '<div class="ver">ShopSathi Business v' + SS.VERSION + '</div></main></div>';
  SS.$('#lang').onchange = (e) => { SS.setLang(e.target.value); renderAuth(mode); };
  SS.$$('[data-m]').forEach((b) => (b.onclick = () => renderAuth(b.dataset.m)));
  SS.$('#af').onsubmit = async (e) => {
    e.preventDefault();
    const mb = SS.$('#mb').value.trim(), pn = SS.$('#pn').value.trim();
    const err = (m) => (SS.$('#aerr').innerHTML = '<div class="err">' + esc(m) + '</div>');
    if (!SS.validMobile(mb)) return err(t('err_mobile'));
    if (!SS.validPin(pn)) return err(t('err_pin'));
    try {
      SS.busy(true);
      if (mode === 'signup') {
        const nm = SS.$('#nm').value.trim();
        if (nm.length < 2) { SS.busy(false); return err(t('err_name')); }
        B.pendingSignup = { name: nm };
        await SS.signup(mb, pn);
      } else await SS.login(mb, pn);
    } catch (ex) { err(SS.authErr(ex)); }
    finally { SS.busy(false); }
  };
}

async function onLogin(u) {
  B.user = u; B.mobile = SS.mobileOf(u);
  const uref = SS.db.collection('users').doc(u.uid);
  let snap = null;
  try { snap = await uref.get(); } catch (e) { snap = await uref.get({ source: 'cache' }).catch(() => null); }
  if (!snap || !snap.exists) {
    B.profile = { name: (B.pendingSignup && B.pendingSignup.name) || '', mobile: B.mobile, lang: SS.lang(), createdAt: SS.now() };
    await uref.set(B.profile, { merge: true }).catch(() => {});
  } else {
    B.profile = snap.data();
    if (B.profile.lang && B.profile.lang !== SS.lang()) SS.setLang(B.profile.lang);
  }
  B.pendingSignup = null;
  const sid = B.profile.ownShop || B.profile.staffShop;
  if (!sid) return renderWizard();
  let sh;
  try { sh = await SS.db.collection('shops').doc(sid).get(); } catch (e) { return renderNoAccess(SS.authErr(e)); }
  if (!sh.exists) { if (B.profile.ownShop) return renderWizard(); return renderNoAccess(t('staff_removed')); }
  const d = sh.data();
  B.shopId = sid; B.shop = d;
  if (d.ownerUid === u.uid) B.role = 'owner';
  else if ((d.staffUids || []).indexOf(u.uid) >= 0) B.role = 'staff';
  else return renderNoAccess(t('staff_removed'));
  SS.askNotify();
  start();
}
function renderNoAccess(msg) {
  cleanup();
  app.innerHTML = '<div class="authwrap"><div class="authhdr">' + SS.logo(72) + SS.wordmark(28) + '</div><main class="page"><div class="err">' + esc(msg) + '</div><button class="btn dark big" id="lo">' + ic('logout') + t('logout') + '</button></main></div>';
  SS.$('#lo').onclick = () => SS.logout();
}

/* ---------------- Setup wizard ---------------- */
const W = { step: 1, data: null };
function wizDefaults() {
  const sc = SS.defaultScheme();
  return {
    name: '', ownerName: B.profile.name || '', type: 'kirana', city: '', address: '', logo: '', shortCode: '',
    pointsMode: 'percent', percent: 0.25, rupeesPerPoint: 100, minBill: 100, uploadDays: 7,
    schemeStart: sc.start, schemeEnd: sc.end, settlementDate: sc.settle,
    welcomeBonus: 0, referBonus: 0, birthdayDouble: false, festival2x: false,
    goldSpend: 10000, goldMult: 1.1, platSpend: 25000, platMult: 1.25, gifts: []
  };
}
function renderWizard() {
  cleanup();
  if (!W.data) W.data = wizDefaults();
  const s = W.step, d = W.data;
  const steps = '<div class="steps" aria-label="Step ' + s + '/5">' + [1, 2, 3, 4, 5].map((i) => '<i class="' + (i <= s ? 'on' : '') + '"></i>').join('') + '</div>';
  const titles = ['', t('wz1'), t('wz2'), t('wz3'), t('wz4'), t('wz5')];
  let body = '';
  if (s === 1) body = groupHTML('shop', d);
  if (s === 2) body = groupHTML('brand', d) + '<label class="f">' + t('short_code') + ' <small>' + t('short_code_hint') + '</small><input class="inp" id="f_shortCode" maxlength="4" value="' + esc(d.shortCode || initials(d.name)) + '" style="text-transform:uppercase;font-weight:700;letter-spacing:2px"></label>';
  if (s === 3) body = groupHTML('points', d);
  if (s === 4) body = groupHTML('scheme', d) + groupHTML('bonus', d) + groupHTML('levels', d);
  if (s === 5) body = '<p class="muted" style="margin:0">' + t('wz5_help') + '</p><div class="list" id="wg">' + d.gifts.map((g, i) => '<div class="item" style="cursor:default"><span class="ic">' + (g.photo ? '<img alt="" src="' + g.photo + '">' : ic('gift', 20)) + '</span><span class="t"><b>' + esc(g.name) + '</b><span>' + SS.fmtPts(g.points) + ' pts</span></span><button class="iconbtn" data-rmg="' + i + '" aria-label="' + t('delete') + '">' + ic('trash', 18) + '</button></div>').join('') + '</div>' +
    '<input type="file" accept="image/*" id="gpf" class="hidden"><div class="row"><button type="button" class="photo-pick" id="gpp" style="min-height:0;width:64px;height:64px;padding:0;flex:none" aria-label="' + t('gift_photo') + '">' + (W.gphoto ? '<img alt="" src="' + W.gphoto + '" style="width:100%;height:100%;object-fit:cover;border-radius:12px;max-height:none">' : ic('camera', 22)) + '</button><input class="inp grow" id="gn" placeholder="' + t('gift_name') + '" value="' + esc(W.gname || '') + '"><input class="inp" id="gp" type="number" inputmode="decimal" placeholder="' + t('points') + '" style="width:96px" value="' + esc(W.gpts || '') + '"></div><div class="small muted">' + t('gift_photo_opt') + '</div><button class="btn light" id="ga">' + ic('plus') + t('add_gift') + '</button>';
  app.innerHTML = '<div class="authwrap"><header class="mhdr"><div class="top">' + SS.logo(40) + '<div class="brand"><b><span>Shop</span>Sathi</b><small>' + t('setup') + ' · ' + t('step_of', { a: s, b: 5 }) + '</small></div></div>' + steps + '<div class="hello">' + titles[s] + '</div></header>' +
    '<main class="page" style="padding-bottom:30px"><form id="wf" class="col">' + body + '<div id="werr"></div><div class="btnrow">' +
    (s > 1 ? '<button type="button" class="btn light" id="prev">' + ic('back') + t('back') + '</button>' : '<button type="button" class="btn light" id="lo">' + ic('logout') + t('logout') + '</button>') +
    '<button type="submit" class="btn dark">' + (s < 5 ? t('next') : t('finish')) + '</button></div></form></main></div>';
  bindGroup(app);
  const prev = SS.$('#prev'); if (prev) prev.onclick = () => { collectWiz(); W.step--; renderWizard(); };
  const lo = SS.$('#lo'); if (lo) lo.onclick = () => SS.logout();
  if (s === 5) {
    SS.$('#gpp').onclick = () => SS.$('#gpf').click();
    SS.$('#gpf').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      W.gname = SS.$('#gn').value; W.gpts = SS.$('#gp').value;
      try { SS.busy(true); W.gphoto = await SS.compress(f, 400, 40); } catch (er) { SS.toast(t('err_photo'), 'err'); } finally { SS.busy(false); }
      renderWizard();
    };
    SS.$('#ga').onclick = () => {
      const n = SS.$('#gn').value.trim(), p = SS.num(SS.$('#gp').value);
      if (!n || !(p > 0)) return SS.toast(t('err_gift'), 'err');
      d.gifts.push({ name: n, points: p, photo: W.gphoto || '' });
      W.gphoto = ''; W.gname = ''; W.gpts = '';
      renderWizard();
    };
    SS.$$('[data-rmg]').forEach((b) => (b.onclick = () => { d.gifts.splice(Number(b.dataset.rmg), 1); renderWizard(); }));
  }
  SS.$('#wf').onsubmit = (e) => {
    e.preventDefault();
    const er = collectWiz();
    if (er) { SS.$('#werr').innerHTML = '<div class="err">' + esc(er) + '</div>'; return; }
    if (s < 5) { W.step++; renderWizard(); window.scrollTo(0, 0); } else createShop();
  };
}
function collectWiz() {
  const s = W.step, d = W.data;
  const groups = { 1: ['shop'], 2: ['brand'], 3: ['points'], 4: ['scheme', 'bonus', 'levels'], 5: [] }[s];
  for (const g of groups) { const r = readGroup(g, app, d); if (r) return r; }
  if (s === 2) {
    const sc = (SS.$('#f_shortCode').value || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (sc.length < 2) return t('err_short');
    d.shortCode = sc;
  }
  return '';
}
function initials(name) {
  const w = String(name || '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(Boolean);
  if (!w.length) return 'SS';
  return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).slice(0, 4);
}
async function createShop() {
  const d = W.data;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  try {
    SS.busy(true);
    let id = '';
    for (let i = 0; i < 6; i++) {
      let c = d.shortCode;
      for (let j = 0; j < 3; j++) c += chars[Math.floor(Math.random() * chars.length)];
      const ex = await SS.db.collection('shops').doc(c).get();
      if (!ex.exists) { id = c; break; }
    }
    if (!id) throw new Error('code');
    const shop = {
      name: d.name, ownerName: d.ownerName, mobile: B.mobile, type: d.type, city: d.city, address: d.address, logo: d.logo || '',
      shortCode: d.shortCode, ownerUid: B.user.uid, staffUids: [], staff: {},
      pointsMode: d.pointsMode, percent: d.percent, rupeesPerPoint: d.rupeesPerPoint, minBill: d.minBill, uploadDays: d.uploadDays,
      schemeStart: d.schemeStart, schemeEnd: d.schemeEnd, settlementDate: d.settlementDate, schemeNo: 1,
      welcomeBonus: d.welcomeBonus, referBonus: d.referBonus, birthdayDouble: d.birthdayDouble, festival2x: d.festival2x,
      goldSpend: d.goldSpend, goldMult: d.goldMult, platSpend: d.platSpend, platMult: d.platMult,
      plan: 'free', paidUntil: 0, active: true, customerCount: 0, nextCode: 1, createdAt: SS.now()
    };
    await SS.db.collection('shops').doc(id).set(shop);
    await SS.db.collection('users').doc(B.user.uid).set({ ownShop: id, name: d.ownerName }, { merge: true });
    const gref = SS.db.collection('shops').doc(id).collection('gifts');
    for (let i = 0; i < d.gifts.length; i++) await gref.add({ name: d.gifts[i].name, points: d.gifts[i].points, photo: d.gifts[i].photo || '', stock: -1, active: true, at: SS.now() + i });
    B.profile.ownShop = id; B.shopId = id; B.shop = shop; B.role = 'owner';
    W.data = null; W.step = 1;
    SS.toast(t('shop_created'), 'ok');
    B.view = { name: 'qr' };
    start();
  } catch (e) { SS.toast(SS.authErr(e), 'err'); }
  finally { SS.busy(false); }
}

/* ---- settings field groups (wizard + settings page) ---- */
function groupHTML(g, d) {
  const inp = (k, label, type, extra) => '<label class="f">' + label + (extra && extra.hint ? ' <small>' + extra.hint + '</small>' : '') + '<input class="inp" id="f_' + k + '" type="' + (type || 'text') + '"' + (type === 'number' ? ' inputmode="decimal" step="any" min="0"' : '') + ' value="' + esc(type === 'date' ? SS.isoDate(d[k]) : d[k] == null ? '' : d[k]) + '"></label>';
  const chk = (k, label) => '<label class="chk"><input type="checkbox" id="f_' + k + '"' + (d[k] ? ' checked' : '') + '>' + label + '</label>';
  if (g === 'shop') return inp('name', t('shop_name')) + inp('ownerName', t('owner_name')) +
    '<label class="f">' + t('shop_type') + '<select class="inp" id="f_type">' + TYPES.map((x) => '<option value="' + x + '"' + (d.type === x ? ' selected' : '') + '>' + t('type_' + x) + '</option>').join('') + '</select></label>' +
    inp('city', t('city')) + inp('address', t('address'), 'text', { hint: t('optional') });
  if (g === 'brand') return '<label class="f">' + t('logo') + ' <small>' + t('optional') + '</small></label><input type="file" accept="image/*" id="f_logofile" class="hidden"><div class="photo-pick" id="logopick" style="min-height:120px">' + (d.logo ? '<img alt="" src="' + d.logo + '" style="max-height:110px">' : ic('image', 36) + '<span>' + t('add_logo') + '</span>') + '</div><input type="hidden" id="f_logo" value="' + esc(d.logo || '') + '">';
  if (g === 'points') return '<div class="f" style="font-size:14px;font-weight:600;color:#33373C">' + t('points_method') + '</div><div class="seg" id="pmode"><button type="button" data-pm="percent" class="' + (d.pointsMode !== 'fixed' ? 'on' : '') + '">' + t('pm_percent') + '</button><button type="button" data-pm="fixed" class="' + (d.pointsMode === 'fixed' ? 'on' : '') + '">' + t('pm_fixed') + '</button></div><input type="hidden" id="f_pointsMode" value="' + (d.pointsMode === 'fixed' ? 'fixed' : 'percent') + '">' +
    '<div id="pm_percent" class="' + (d.pointsMode === 'fixed' ? 'hidden' : '') + '">' + inp('percent', t('percent_lbl'), 'number', { hint: t('percent_hint') }) + '</div>' +
    '<div id="pm_fixed" class="' + (d.pointsMode === 'fixed' ? '' : 'hidden') + '">' + inp('rupeesPerPoint', t('rupees_lbl'), 'number', { hint: t('rupees_hint') }) + '</div>' +
    '<div class="small muted" id="pm_ex"></div>' +
    inp('minBill', t('min_bill'), 'number', { hint: t('min_bill_hint') }) + inp('uploadDays', t('upload_days'), 'number', { hint: t('upload_days_hint') });
  if (g === 'scheme') return '<b>' + t('scheme') + '</b>' + inp('schemeStart', t('scheme_start'), 'date') + inp('schemeEnd', t('scheme_end'), 'date') + inp('settlementDate', t('settle_date'), 'date', { hint: t('settle_hint') });
  if (g === 'bonus') return '<b>' + t('bonus_points') + '</b>' + inp('welcomeBonus', t('welcome_bonus'), 'number', { hint: t('zero_off') }) + inp('referBonus', t('refer_bonus'), 'number', { hint: t('refer_bonus_hint') }) + chk('birthdayDouble', t('birthday_double')) + chk('festival2x', t('festival_2x'));
  if (g === 'levels') return '<b>' + t('levels') + '</b><div class="small muted">' + t('levels_hint') + '</div>' +
    '<div class="row">' + inp('goldSpend', t('gold_from'), 'number') + inp('goldMult', t('multiplier'), 'number') + '</div>' +
    '<div class="row">' + inp('platSpend', t('plat_from'), 'number') + inp('platMult', t('multiplier'), 'number') + '</div>';
  return '';
}
function bindGroup(root) {
  const lp = SS.$('#logopick', root);
  if (lp) {
    lp.onclick = () => SS.$('#f_logofile', root).click();
    SS.$('#f_logofile', root).onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const data = await SS.compress(f, 256, 30);
      SS.$('#f_logo', root).value = data; lp.innerHTML = '<img alt="" src="' + data + '" style="max-height:110px">';
    };
  }
  const pm = SS.$('#pmode', root);
  if (pm) {
    const ex = () => {
      const mode = SS.$('#f_pointsMode', root).value;
      const fake = { pointsMode: mode, percent: SS.num(SS.$('#f_percent', root).value), rupeesPerPoint: SS.num(SS.$('#f_rupeesPerPoint', root).value), minBill: 0 };
      SS.$('#pm_ex', root).textContent = t('pm_example', { p: SS.fmtPts(SS.calcPoints(fake, 1000, null).points) });
    };
    SS.$$('[data-pm]', pm).forEach((b) => (b.onclick = () => {
      SS.$$('[data-pm]', pm).forEach((x) => x.classList.toggle('on', x === b));
      SS.$('#f_pointsMode', root).value = b.dataset.pm;
      SS.$('#pm_percent', root).classList.toggle('hidden', b.dataset.pm !== 'percent');
      SS.$('#pm_fixed', root).classList.toggle('hidden', b.dataset.pm !== 'fixed');
      ex();
    }));
    SS.$('#f_percent', root).oninput = ex; SS.$('#f_rupeesPerPoint', root).oninput = ex; ex();
  }
}
function readGroup(g, root, d) {
  const v = (k) => { const el = SS.$('#f_' + k, root); return el ? el.value.trim() : ''; };
  const n = (k) => SS.num(v(k));
  const c = (k) => { const el = SS.$('#f_' + k, root); return !!(el && el.checked); };
  if (g === 'shop') {
    d.name = v('name'); d.ownerName = v('ownerName'); d.type = v('type'); d.city = v('city'); d.address = v('address');
    if (d.name.length < 2) return t('err_shop_name');
    if (d.ownerName.length < 2) return t('err_name');
  }
  if (g === 'brand') d.logo = v('logo');
  if (g === 'points') {
    d.pointsMode = v('pointsMode') === 'fixed' ? 'fixed' : 'percent';
    d.percent = n('percent'); d.rupeesPerPoint = n('rupeesPerPoint'); d.minBill = n('minBill'); d.uploadDays = Math.round(n('uploadDays'));
    if (d.pointsMode === 'percent' && !(d.percent > 0 && d.percent <= 100)) return t('err_percent');
    if (d.pointsMode === 'fixed' && !(d.rupeesPerPoint > 0)) return t('err_rupees');
    if (!(d.uploadDays >= 1)) return t('err_days');
  }
  if (g === 'scheme') {
    d.schemeStart = SS.fromIso(v('schemeStart')); d.schemeEnd = SS.fromIso(v('schemeEnd')); d.settlementDate = SS.fromIso(v('settlementDate'));
    if (!d.schemeStart || !d.schemeEnd || d.schemeEnd < d.schemeStart) return t('err_scheme_dates');
    if (!d.settlementDate || d.settlementDate < d.schemeEnd) return t('err_settle_date');
  }
  if (g === 'bonus') { d.welcomeBonus = n('welcomeBonus'); d.referBonus = n('referBonus'); d.birthdayDouble = c('birthdayDouble'); d.festival2x = c('festival2x'); }
  if (g === 'levels') {
    d.goldSpend = n('goldSpend'); d.goldMult = n('goldMult') || 1; d.platSpend = n('platSpend'); d.platMult = n('platMult') || 1;
    if (d.platSpend && d.goldSpend && d.platSpend <= d.goldSpend) return t('err_levels');
  }
  return '';
}

/* ---------------- Main listeners ---------------- */
function start() {
  cleanup();
  const sref = shopRef();
  const onErr = (e) => console.warn(e);
  B.unsub.push(sref.onSnapshot((d) => {
    if (!d.exists) { if (!d.metadata.fromCache) { cleanup(); if (isOwner()) { B.profile.ownShop = null; renderWizard(); } else renderNoAccess(t('staff_removed')); } return; }
    B.shop = d.data();
    if (B.role === 'staff' && (B.shop.staffUids || []).indexOf(B.user.uid) < 0) { cleanup(); return renderNoAccess(t('staff_removed')); }
    render();
  }, onErr));
  B.unsub.push(sref.collection('members').onSnapshot((q) => {
    B.members = SS.docs(q); B.memMap = {}; B.members.forEach((m) => (B.memMap[m.id] = m)); render();
  }, onErr));
  B.unsub.push(sref.collection('bills').where('status', '==', 'pending').onSnapshot((q) => {
    const list = SS.docs(q).sort((a, b) => a.uploadedAt - b.uploadedAt);
    if (B.seenPending) { const fresh = list.filter((b) => !B.seenPending.has(b.id)); if (fresh.length) SS.notify(t('n_new_bill_t'), t('n_new_bill_b', { n: fresh.length, c: fresh[0].memberName || fresh[0].memberCode })); }
    B.seenPending = new Set(list.map((b) => b.id));
    B.pending = list; render();
  }, onErr));
  B.unsub.push(sref.collection('gifts').onSnapshot((q) => { B.gifts = SS.docs(q).sort((a, b) => a.points - b.points); render(); }, onErr));
  B.unsub.push(sref.collection('redemptions').where('status', '==', 'requested').onSnapshot((q) => { B.reds = SS.docs(q).sort((a, b) => a.at - b.at); render(); }, onErr));
  loadMonthStats();
  render();
}
async function loadMonthStats() {
  const now = new Date();
  const s = SS.monthStart(now.getFullYear(), now.getMonth());
  try {
    const q = await shopRef().collection('bills').where('approvedAt', '>=', s).get();
    const ap = SS.docs(q).filter((b) => b.status === 'approved');
    B.monthStats = { sales: ap.reduce((a, b) => a + (b.finalAmount || 0), 0), points: ap.reduce((a, b) => a + (b.points || 0), 0), count: ap.length };
    render();
  } catch (e) { console.warn(e); }
}

function askReject(b) {
  const s = SS.sheet(t('reject_reason'), '<div class="chips reasons">' + REASONS.map((r) => '<button class="chip" data-r="' + r + '">' + t(r) + '</button>').join('') + '</div><label class="f">' + t('other_reason') + '<input class="inp" id="rr"></label><button class="btn danger big" id="go">' + ic('x') + t('reject') + '</button>');
  let sel = '';
  SS.$$('[data-r]', s.el).forEach((c) => (c.onclick = () => { sel = t(c.dataset.r); SS.$$('[data-r]', s.el).forEach((x) => x.classList.toggle('on', x === c)); s.el.querySelector('#rr').value = sel; }));
  s.el.querySelector('#go').onclick = async () => {
    const reason = s.el.querySelector('#rr').value.trim() || sel;
    if (!reason) return SS.toast(t('err_reason'), 'err');
    try { await doReject(b, reason); s.close(); } catch (e) {}
  };

function doReject(b, reason) {
  return SS.run(async () => {
    const sref = shopRef(), bref = sref.collection('bills').doc(b.id);
    await SS.db.runTransaction(async (tx) => {
      const cur = await tx.get(bref);
      if (!cur.exists || cur.data().status !== 'pending') throw new Error(t('err_already'));
      tx.update(bref, { status: 'rejected', reason: reason, approvedBy: B.user.uid, approvedByName: whoAmI(), approvedAt: SS.now() });
      tx.set(sref.collection('members').doc(b.memberId).collection('notifs').doc(), { kind: 'rejected', amount: b.amount, reason: reason, at: SS.now(), read: false });
    });
  }, t('rejected_ok'));
}

/* ---------------- Duplicate bill check ----------------
   wahi photo / wahi bill no. / same customer + same din + same amount.
   hard = pakka duplicate (approve nahi hoga), soft = bill no. alag hai, malik khud dekhe. */
async function findDups(b) {
  const col = shopRef().collection('bills'), found = {};
  const add = (q) => q.docs.forEach((d) => { if (d.id !== b.id) found[d.id] = Object.assign({ id: d.id }, d.data()); });
  const jobs = [];
  if (b.photoHash) jobs.push(col.where('photoHash', '==', b.photoHash).limit(10).get().then(add));
  if (b.billNo) jobs.push(col.where('billNo', '==', b.billNo).limit(10).get().then(add));
  if (b.memberId && b.billDate) jobs.push(col.where('memberId', '==', b.memberId).where('billDate', '==', b.billDate).limit(30).get().then(add));
  await Promise.all(jobs.map((p) => p.catch((e) => console.warn('dup', e))));
  B.pending.concat(B.recent || [], B.custBills || []).forEach((o) => { if (o.id !== b.id && !found[o.id]) found[o.id] = o; });
  const res = { hard: [], soft: [] };
  Object.values(found).forEach((o) => {
    const k = SS.dupKind(b, o);
    if (!k || !SS.dupBefore(o, b)) return;
    (SS.dupHard(k) ? res.hard : res.soft).push(Object.assign({ _k: k }, o));
  });
  return res;
}
function localDup(b) {
  // pending par har shak dikhao; approved par sirf pakka duplicate
  return B.pending.concat(B.recent || []).some((o) => {
    if (o.id === b.id || !SS.dupBefore(o, b)) return false;
    const k = SS.dupKind(b, o);
    return b.status === 'pending' ? !!k : SS.dupHard(k);
  });
}
function dupLine(o) {
  return '• ' + esc(SS.tDev('dupk_' + o._k)) + ': ' + esc(o.memberCode || '') + ' · ' + SS.fmtRs(o.status === 'approved' ? o.finalAmount : o.amount) + ' · ' + SS.fmtDate(o.billDate) + (o.billNo ? ' · #' + esc(o.billNo) : '') + ' · ' + SS.tDev('st_' + o.status);
}

function askReverse(b) {
  const s = SS.sheet(t('rev_title'),

    '<button class="btn danger big" id="go">' + ic('x') + t('rev_btn') + '</button>');
  s.el.querySelector('#go').onclick = async () => {
    const reason = s.el.querySelector('#rr').value.trim() || t('rs_dup');
    try { await reverseBill(b, reason); s.close(); if (B.view && B.view.name === 'cust') loadCust(b.memberId); loadMonthStats(); if (B.recent) loadRecent(); } catch (e) {}
  };
}
function reverseBill(b, reason) {
  return SS.run(async () => {
    const sref = shopRef(), bref = sref.collection('bills').doc(b.id), mref = sref.collection('members').doc(b.memberId);
    await SS.db.runTransaction(async (tx) => {
      const cb = await tx.get(bref), m = await tx.get(mref);
      if (!cb.exists || cb.data().status !== 'approved') throw new Error(t('err_already'));
      const bd = cb.data(), now = SS.now();
      const pts = Number(bd.points) || 0, amt = Number(bd.finalAmount) || 0;
      tx.update(bref, { status: 'rejected', reason: reason, reversed: true, reversedPoints: pts, reversedAt: now, reversedBy: B.user.uid, reversedByName: whoAmI() });
      if (m.exists) {
        const md = m.data();
        const spend = Math.max(0, (Number(md.totalSpend) || 0) - amt);
        tx.update(mref, { points: SS.FV.increment(-pts), lifetimePoints: SS.FV.increment(-pts), totalSpend: SS.FV.increment(-amt), billCount: SS.FV.increment(-1), level: SS.levelFor(B.shop, spend) });
        tx.set(sref.collection('ledger').doc(), { memberId: b.memberId, type: 'reversal', points: -pts, billId: b.id, amount: amt, note: SS.fmtRs(amt) + ' · ' + reason, at: now });
        tx.set(mref.collection('notifs').doc(), { kind: 'reversed', amount: amt, points: pts, reason: reason, at: now, read: false });
      }
    });
  }, t('rev_ok'));
}
function whoAmI() { return B.role === 'owner' ? B.shop.ownerName : ((B.shop.staff && B.shop.staff[B.user.uid] && B.shop.staff[B.user.uid].name) || B.profile.name || B.mobile); }

/* points credit: pending bill approve ya naya manual bill — ek transaction mein */
async function creditBill(o) {
  const sref = shopRef();
  const sh = B.shop;
  const mref = sref.collection('members').doc(o.memberId);
  const bref = o.billId ? sref.collection('bills').doc(o.billId) : sref.collection('bills').doc();
  // referral: pehle referrer dhoondo (transaction ke bahar query)
  let refRef = null;
  const pre = await mref.get();
  if (!pre.exists) throw new Error(t('err_cust_nf'));
  const pm = pre.data();
  if (pm.referredBy && !pm.referralPaid && Number(sh.referBonus) > 0) {
    const q = await sref.collection('members').where('code', '==', pm.referredBy).limit(1).get();
    if (!q.empty && q.docs[0].id !== o.memberId) refRef = q.docs[0].ref;
  }
  const now = SS.now();
  await SS.db.runTransaction(async (tx) => {
    const m = await tx.get(mref);
    if (!m.exists) throw new Error(t('err_cust_nf'));
    if (o.billId) {
      const cb = await tx.get(bref);
      if (!cb.exists || cb.data().status !== 'pending') throw new Error(t('err_already'));
    }
    const r = refRef ? await tx.get(refRef) : null;
    const md = m.data();
    const calc = SS.calcPoints(sh, o.finalAmount, md, now);
    const pts = calc.points;
    const newSpend = (Number(md.totalSpend) || 0) + o.finalAmount;
    let add = pts;
    const upd = { totalSpend: SS.FV.increment(o.finalAmount), level: SS.levelFor(sh, newSpend), billCount: SS.FV.increment(1), lastBillAt: now };
    const billUpd = { status: 'approved', finalAmount: o.finalAmount, points: pts, calcNote: calc.notes.join(', '), approvedBy: B.user.uid, approvedByName: whoAmI(), approvedAt: now };
    if (o.billId) tx.update(bref, billUpd);
    else tx.set(bref, Object.assign({ memberId: o.memberId, memberName: md.name || '', memberCode: md.code, amount: o.finalAmount, billNo: o.billNo || '', billDate: o.billDate || now, uploadedAt: now, photoHash: o.photoHash || '', thumb: o.thumb || '', hasPhoto: !!o.photo, by: 'shop' }, billUpd));
    if (o.photo && !o.billId) tx.set(sref.collection('photos').doc(bref.id), { memberId: o.memberId, data: o.photo, at: now });
    tx.set(sref.collection('ledger').doc(), { memberId: o.memberId, type: 'bill', points: pts, billId: bref.id, amount: o.finalAmount, note: SS.fmtRs(o.finalAmount), at: now });
    tx.set(mref.collection('notifs').doc(), { kind: 'approved', amount: o.finalAmount, points: pts, at: now, read: false });
    if (r && r.exists && !md.referralPaid) {
      const rb = Number(sh.referBonus) || 0;
      add += rb;
      upd.referralPaid = true;
      tx.update(r.ref, { points: SS.FV.increment(rb), lifetimePoints: SS.FV.increment(rb) });
      tx.set(sref.collection('ledger').doc(), { memberId: o.memberId, type: 'referral', points: rb, note: md.referredBy, at: now });
      tx.set(sref.collection('ledger').doc(), { memberId: r.id, type: 'referral', points: rb, note: md.code + ' ' + (md.name || ''), at: now });
      tx.set(mref.collection('notifs').doc(), { kind: 'referral', points: rb, at: now, read: false });
      tx.set(r.ref.collection('notifs').doc(), { kind: 'referral', points: rb, name: md.name || md.code, at: now, read: false });
    }
    upd.points = SS.FV.increment(add);
    upd.lifetimePoints = SS.FV.increment(add);
    tx.update(mref, upd);
  });
}

async function giveGift(id) {
  const r = B.reds.find((x) => x.id === id); if (!r) return;
  if (!(await SS.confirm(t('confirm_give', { g: r.giftName, n: r.memberName || r.memberCode, p: SS.fmtPts(r.points) }), t('gift_given')))) return;
  const sref = shopRef();
  const rref = sref.collection('redemptions').doc(id), mref = sref.collection('members').doc(r.memberId), gref = sref.collection('gifts').doc(r.giftId);
  try {
    await SS.run(() => SS.db.runTransaction(async (tx) => {
      const rd = await tx.get(rref), md = await tx.get(mref), gd = await tx.get(gref);
      if (!rd.exists || rd.data().status !== 'requested') throw new Error(t('err_already'));
      if (!md.exists) throw new Error(t('err_cust_nf'));
      if ((md.data().points || 0) + 1e-9 < r.points) throw new Error(t('w_low_points'));
      if (gd.exists && gd.data().stock === 0) throw new Error(t('out_of_stock'));
      const now = SS.now();
      tx.update(rref, { status: 'given', givenAt: now, givenBy: whoAmI() });
      tx.update(mref, { points: SS.FV.increment(-r.points) });
      if (gd.exists && gd.data().stock > 0) tx.update(gref, { stock: gd.data().stock - 1 });
      tx.set(sref.collection('ledger').doc(), { memberId: r.memberId, type: 'gift', points: -r.points, note: r.giftName, at: now });
      tx.set(mref.collection('notifs').doc(), { kind: 'gift', gift: r.giftName, points: r.points, at: now, read: false });
    }), t('gift_given_ok'));
  } catch (e) {}
}

async function loadReport(month) {
  const p = month.split('-').map(Number);
  const s = SS.monthStart(p[0], p[1] - 1), e = SS.monthStart(p[0], p[1]);
  const sref = shopRef();
  try {
    const [ap, up, lg] = await Promise.all([
      sref.collection('bills').where('approvedAt', '>=', s).where('approvedAt', '<', e).get(),
      sref.collection('bills').where('uploadedAt', '>=', s).where('uploadedAt', '<', e).get(),
      sref.collection('ledger').where('at', '>=', s).where('at', '<', e).get()
    ]);
    const apb = SS.docs(ap);
    const ok = apb.filter((b) => b.status === 'approved');
    const rej = apb.filter((b) => b.status === 'rejected');
    const led = SS.docs(lg);
    const per = {};
    ok.forEach((b) => { const k = b.memberId; per[k] = per[k] || { name: b.memberName || (B.memMap[k] || {}).name || k, code: b.memberCode, sales: 0, n: 0 }; per[k].sales += b.finalAmount || 0; per[k].n++; });
    const data = {
      approved: ok.length, rejected: rej.length, uploaded: up.size,
      sales: ok.reduce((a, b) => a + (b.finalAmount || 0), 0),
      pointsGiven: led.filter((l) => l.points > 0 || l.type === 'reversal').reduce((a, l) => a + l.points, 0),
      giftsGiven: led.filter((l) => l.type === 'gift').length,
      newCust: B.members.filter((m) => m.joinedAt >= s && m.joinedAt < e).length,
      top: Object.values(per).sort((a, b) => b.sales - a.sales).slice(0, 10)
    };
    if (B.view && B.view.name === 'reports' && B.view.month === month) { B.view.data = data; render(); }
  } catch (err) { SS.toast(SS.authErr(err), 'err'); }
}

function newScheme() {
  const sc = SS.defaultScheme();
  const nextStart = Math.max(sc.start, SS.dayStart(B.shop.schemeEnd + 86400000));
  const yr = new Date(nextStart).getFullYear() + (new Date(nextStart).getMonth() > 2 ? 1 : 0);
  const s = SS.sheet(t('new_scheme'),
    '<label class="f">' + t('scheme_start') + '<input class="inp" type="date" id="ns" value="' + SS.isoDate(nextStart) + '"></label>' +
    '<label class="f">' + t('scheme_end') + '<input class="inp" type="date" id="ne" value="' + SS.isoDate(new Date(yr, 2, 31).getTime()) + '"></label>' +
    '<label class="f">' + t('settle_date') + '<input class="inp" type="date" id="nt" value="' + SS.isoDate(new Date(yr, 3, 30).getTime()) + '"></label>' +
    '<label class="chk"><input type="checkbox" id="rs" checked>' + t('reset_points') + '</label><div class="warn">' + t('reset_warn') + '</div>' +
    '<button class="btn dark big" id="go">' + t('start_scheme') + '</button>');
  s.el.querySelector('#go').onclick = async () => {
    const st = SS.fromIso(s.el.querySelector('#ns').value), en = SS.fromIso(s.el.querySelector('#ne').value), se = SS.fromIso(s.el.querySelector('#nt').value);
    if (!st || !en || en < st) return SS.toast(t('err_scheme_dates'), 'err');
    if (!se || se < en) return SS.toast(t('err_settle_date'), 'err');
    const reset = s.el.querySelector('#rs').checked;
    if (!(await SS.confirm(reset ? t('confirm_reset') : t('confirm_new_scheme'), t('start_scheme'), reset))) return;
    try {
      await SS.run(async () => {
        const sref = shopRef(), now = SS.now();
        if (reset) {
          const mem = (await sref.collection('members').get()).docs;
          for (let i = 0; i < mem.length; i += 200) {
            const b = SS.db.batch();
            mem.slice(i, i + 200).forEach((d) => {
              const p = Number(d.data().points) || 0;
              b.update(d.ref, { points: 0, totalSpend: 0, level: 'silver', billCount: 0 });
              if (p) b.set(sref.collection('ledger').doc(), { memberId: d.id, type: 'reset', points: -p, note: t('scheme') + ' ' + (B.shop.schemeNo || 1), at: now });
            });
            await b.commit();
          }
        }
        await sref.update({ schemeStart: st, schemeEnd: en, settlementDate: se, schemeNo: (B.shop.schemeNo || 1) + 1 });
      }, t('scheme_started'));
      s.close(); B.drawing = null; B.view = null; B.tab = 'home'; draw();
    } catch (e) {}
  };
}

        catch (e) { if (e.code === 'auth/email-already-in-use') cred = await app2.auth().signInWithEmailAndPassword(SS.emailFor(mob), pin); else throw e; }
        const uid = cred.user.uid;
        const upd = { staffUids: SS.FV.arrayUnion(uid) };
        upd['staff.' + uid] = { name, mobile: mob, at: SS.now() };
        await shopRef().update(upd);
        await app2.firestore().collection('users').doc(uid).set({ staffShop: B.shopId, name, mobile: mob }, { merge: true });
        await app2.auth().signOut();
      }, t('staff_added'));
      s.close();
    } catch (e) {}
    finally { app2.delete().catch(() => {}); }
  };
}
async function removeStaff(uid) {
  if (!(await SS.confirm(t('confirm_rm_staff'), t('remove'), true))) return;
  const upd = { staffUids: SS.FV.arrayRemove(uid) };
  upd['staff.' + uid] = SS.FV.delete();
  SS.run(() => shopRef().update(upd), t('done'));
}
function openPlan() {
  const sh = B.shop, price = SS.CFG.planPrice || 199;
  const upi = SS.CFG.upiId ? 'upi://pay?pa=' + encodeURIComponent(SS.CFG.upiId) + '&pn=ShopSathi&am=' + price + '&cu=INR&tn=' + encodeURIComponent('ShopSathi ' + B.shopId) : '';
  const msg = t('upgrade_msg', { id: B.shopId, s: sh.name, p: price });
  SS.sheet(t('plan'),
    '<div class="card"><div class="kv"><span>' + t('plan') + '</span><b>' + (sh.plan === 'paid' ? t('plan_paid') : t('plan_free')) + '</b></div>' +
    '<div class="kv"><span>' + t('customers') + '</span><b>' + (sh.customerCount || 0) + (sh.plan === 'paid' ? '' : ' / ' + (SS.CFG.freeLimit || 50)) + '</b></div>' +
    (sh.plan === 'paid' ? '<div class="kv"><span>' + t('valid_till') + '</span><b>' + SS.fmtDateFull(sh.paidUntil) + '</b></div>' : '') + '</div>' +
    '<div class="okbox">' + t('plan_paid_info', { p: price }) + '</div>' +
    (upi ? '<a class="btn gold big" href="' + esc(upi) + '">' + t('pay_upi', { p: price }) + '</a>' : '') +
    '<a class="btn dark big" target="_blank" rel="noopener" href="https://wa.me/' + esc(SS.CFG.adminWhatsApp || '') + '?text=' + encodeURIComponent(msg) + '">' + ic('wa') + t('contact_admin') + '</a>' +
    '<div class="small muted">' + t('plan_after_pay') + '</div>');
}

/* ---------------- Bindings ---------------- */
function bindAll() {
  SS.$$('[data-tab]').forEach((b) => (b.onclick = () => go(b.dataset.tab)));
  SS.$$('[data-view]').forEach((b) => (b.onclick = () => openView(b.dataset.view)));
  SS.$$('[data-bill]').forEach((b) => (b.onclick = () => openBill(b.dataset.bill)));
  SS.$$('[data-cust]').forEach((b) => (b.onclick = () => open({ name: 'cust', id: b.dataset.cust })));
  const on = (id, fn) => { const el = SS.$('#' + id); if (el) el.onclick = fn; };
  on('back', () => { B.view = null; B.keepScroll = false; draw(); });
  on('scanc', scanCustomer);
  on('addc', addCustomer);
  on('upg', openPlan);
  // bills
  SS.$$('[data-bm]').forEach((b) => (b.onclick = () => { B.billMode = b.dataset.bm; if (B.billMode === 'recent') { B.recent = null; loadRecent(); } draw(); }));
  // customers
  const cq = SS.$('#cq');
  if (cq) cq.oninput = (e) => {
    B.custQuery = e.target.value.trim();
    const q = B.custQuery.toLowerCase();
    const list = B.members.filter((m) => !q || (m.name || '').toLowerCase().indexOf(q) >= 0 || m.id.indexOf(q) >= 0 || (m.code || '').toLowerCase().indexOf(q) >= 0);
    SS.$('#clist').innerHTML = custRows(list);
    SS.$$('#clist [data-cust]').forEach((b) => (b.onclick = () => open({ name: 'cust', id: b.dataset.cust })));
  };
  SS.$$('[data-cs]').forEach((b) => (b.onclick = () => { B.custSort = b.dataset.cs; draw(); }));
  if (B.view && B.view.name === 'cust') {
    if (!B.custData || B.custData.id !== B.view.id) { if (B.loadingCust !== B.view.id) { B.loadingCust = B.view.id; loadCust(B.view.id).then(() => (B.loadingCust = null)); } }
    SS.$$('[data-ct]').forEach((b) => (b.onclick = () => { B.view.tab = b.dataset.ct; draw(); }));
    on('addbill', () => addBill(B.view.id));
    on('setdob', () => {
      const mm = B.memMap[B.view.id];
      const sh = SS.sheet(t('birth_month'), '<select class="inp" id="dm">' + SS.MONTH_OPTIONS(mm.dobMonth || 0) + '</select><button class="btn dark big" id="sv">' + t('save') + '</button>');
      sh.el.querySelector('#sv').onclick = async () => {
        const v = Number(sh.el.querySelector('#dm').value) || 0;
        try { await SS.run(() => shopRef().collection('members').doc(mm.id).update({ dobMonth: v }), t('saved')); sh.close(); } catch (e) {}
      };
    });
    on('blk', async () => {
      const m = B.memMap[B.view.id];
      if (!(await SS.confirm(m.blocked ? t('confirm_unblock') : t('confirm_block'), m.blocked ? t('unblock') : t('block'), !m.blocked))) return;
      SS.run(() => shopRef().collection('members').doc(m.id).update({ blocked: !m.blocked }), t('done'));
    });
  }
  // gifts
  on('addg', () => editGift(null));
  SS.$$('[data-gift]').forEach((b) => (b.onclick = () => { if (isOwner()) editGift(B.gifts.find((g) => g.id === b.dataset.gift)); }));
  SS.$$('[data-rgive]').forEach((b) => (b.onclick = () => giveGift(b.dataset.rgive)));
  SS.$$('[data-rcancel]').forEach((b) => (b.onclick = () => cancelGift(b.dataset.rcancel)));
  // more
  on('m_qr', () => open({ name: 'qr' }));
  on('m_rep', () => openView('reports'));
  on('m_plan', openPlan);
  on('m_set', () => open({ name: 'settings' }));
  on('m_staff', () => open({ name: 'staff' }));
  on('m_xl', exportExcel);
  on('xl', exportExcel);
  const lang = SS.$('#lang');
  if (lang) lang.onchange = (e) => { SS.setLang(e.target.value); SS.db.collection('users').doc(B.user.uid).set({ lang: e.target.value }, { merge: true }).catch(() => {}); draw(); };
  on('lo', async () => { if (await SS.confirm(t('confirm_logout'), t('logout'))) SS.logout(); });
  // qr
  if (B.view && B.view.name === 'qr') {
    const link = (SS.CFG.baseUrl || '') + 'customer/?join=' + encodeURIComponent(B.shopId);
    SS.qr(SS.$('#sqr'), link);
    on('shr', () => SS.share(t('shop_share_msg', { s: B.shop.name, c: B.shopId }), link));
    on('prt', () => window.print());
    on('cp', () => SS.copy(link));
  }
  // reports
  if (B.view && B.view.name === 'reports') {
    SS.$('#mon').onchange = (e) => { B.view.month = e.target.value; B.view.data = null; draw(); loadReport(B.view.month); };
  }
  // settings
  if (B.view && B.view.name === 'settings') {
    bindGroup(app);
    B.drawing = () => B.view && B.view.name === 'settings';
    SS.$('#sf').onsubmit = (e) => { e.preventDefault(); saveSettings(); };
    on('arch', photoArchive);
    on('nsch', newScheme);
    on('delshop', deleteShop);
    const bk = SS.$('#back'); if (bk) bk.onclick = () => { B.drawing = null; B.view = null; B.keepScroll = false; draw(); };
  }
  // staff
  if (B.view && B.view.name === 'staff') {
    on('addst', addStaff);
    SS.$$('[data-rmstaff]').forEach((b) => (b.onclick = () => removeStaff(b.dataset.rmstaff)));
  }
}
function openView(name) {
  if (name === 'reports') {
    const d = new Date();
    const month = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    open({ name: 'reports', month, data: null });
    loadReport(month);
  } else open({ name });
}

boot();
})();
</script>
